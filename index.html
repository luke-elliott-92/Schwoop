<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8EDF4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1524" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Schwoop">
<meta name="application-name" content="Schwoop">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<title>Schwoop Scorekeeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow scorepad column — standings first, then the round entry card, then the round-by-round log. Player colors borrow from multi-colored Swoop decks. */
:root{
  --bg:#E8EDF4; --surface:#FFFFFF; --ink:#14213A; --muted:#5A6982; --line:#D2DAE6;
  --accent:#1F4FD8; --accent-ink:#FFFFFF;
  --lead:#0B7F57; --lead-soft:#DCF2E8; --warn:#B93C0B; --out:#1F4FD8; --out-soft:#E2E9FD;
  --p1:#D21F3C; --p2:#1F4FD8; --p3:#0B7F57; --p4:#C98200; --p5:#7A3EC2; --p6:#0A86A0; --p7:#B93C0B; --p8:#5A6982;
  --on-pc:#FFFFFF; --shadow:rgba(20,33,58,.16);
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1524; --surface:#172238; --ink:#E7ECF5; --muted:#9AA8C0; --line:#2A3853;
    --accent:#7D9BFF; --accent-ink:#0E1524;
    --lead:#4FD1A0; --lead-soft:#12352D; --warn:#FF9A5C; --out:#9DB3FF; --out-soft:#1F2C4F;
    --p1:#FF6B7F; --p2:#7D9BFF; --p3:#4FD1A0; --p4:#F5B940; --p5:#B48AF0; --p6:#4CC9E0; --p7:#FF9A5C; --p8:#9AA8C0;
    --on-pc:#0E1524; --shadow:rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1524; --surface:#172238; --ink:#E7ECF5; --muted:#9AA8C0; --line:#2A3853;
  --accent:#7D9BFF; --accent-ink:#0E1524;
  --lead:#4FD1A0; --lead-soft:#12352D; --warn:#FF9A5C; --out:#9DB3FF; --out-soft:#1F2C4F;
  --p1:#FF6B7F; --p2:#7D9BFF; --p3:#4FD1A0; --p4:#F5B940; --p5:#B48AF0; --p6:#4CC9E0; --p7:#FF9A5C; --p8:#9AA8C0;
  --on-pc:#0E1524; --shadow:rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 72px;-webkit-text-size-adjust:100%;
}
.app{max-width:560px;margin:0 auto;display:grid;gap:18px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:8px 16px;flex-wrap:wrap}
.mark{position:relative;margin:0;padding-bottom:10px;font-family:var(--display);font-weight:800;font-size:2.5rem;line-height:1;letter-spacing:-0.025em}
.mark svg{position:absolute;left:2px;right:0;bottom:0;width:100%;height:12px}
.mark path{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round}
.meta{color:var(--muted);font-size:.875rem;font-weight:600;padding-bottom:6px}
h2{margin:0;font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1.1;letter-spacing:-0.01em;text-wrap:balance}
p{margin:0}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.8125rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:1rem;border-radius:12px;border:1px solid transparent;padding:10px 16px;min-height:48px;cursor:pointer}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn-danger{background:transparent;color:var(--warn);border-color:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{font:inherit;font-weight:600;background:none;border:0;padding:6px 0;color:var(--accent);cursor:pointer;text-align:left;justify-self:start}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.field{font:inherit;font-size:1.0625rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:48px;width:100%;min-width:0}
.field.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.err{color:var(--warn);font-weight:600;font-size:.9375rem}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.actions .wide{flex:1}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--pc)}
.who{display:flex;align-items:center;gap:8px;min-width:0;font-weight:700;font-size:1.0625rem}
.who .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Setup */
.add{display:grid;grid-template-columns:1fr auto;gap:10px}
.roster{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.roster li{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg);border-radius:12px;font-weight:700;font-size:1.0625rem}
.roster li .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roster li.is-dealer{box-shadow:inset 0 0 0 2px var(--pc)}
.roster .pick{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:40px;font:inherit;font-weight:700;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.card-ic{width:10px;height:13px;flex:none}
.dchip{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:700;line-height:1.4;padding:2px 9px;border-radius:999px;background:var(--pc);color:var(--on-pc);white-space:nowrap}
.deal{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--bg)}
.deal-ic{width:38px;height:38px;border-radius:11px;background:var(--pc);color:var(--on-pc);display:grid;place-items:center}
.deal-ic .card-ic{width:15px;height:20px}
.deal-txt{display:grid;gap:1px;min-width:0;font-size:1.0625rem}
.deal-txt .muted{font-size:.8125rem;font-variant-numeric:tabular-nums}
.deal .link{min-height:44px;padding:0 4px}
.deal-pick{display:flex;flex-wrap:wrap;gap:8px}
.dpick{font:inherit;font-weight:700;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.dpick[aria-pressed="true"]{border-color:var(--pc);box-shadow:inset 0 0 0 1px var(--pc)}
.roster .seat{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.875rem;width:1.25em}
.roster .link{color:var(--muted);font-size:.875rem}
.tgt-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.tgt-row .field{width:96px}

/* Standings */
.board{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.row{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:6px 12px;padding:12px 14px;border-radius:14px;background:var(--bg)}
.row.lead{background:var(--lead-soft)}
.rank{font-family:var(--display);font-weight:800;font-size:1.125rem;color:var(--muted);font-variant-numeric:tabular-nums}
.total{font-family:var(--display);font-weight:800;font-size:1.75rem;line-height:1;font-variant-numeric:tabular-nums}
.bar{grid-column:2 / 4;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--pc)}
.sub{grid-column:2 / 4;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.8125rem;color:var(--muted);font-variant-numeric:tabular-nums}
.warn{color:var(--warn);font-weight:700}
.chip{font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--lead);color:var(--surface)}

/* Game over */
.over{background:var(--lead-soft);border-color:var(--lead)}
.over h2{font-size:2rem}

/* Round entry */
.entry-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.entry-list{display:grid;gap:10px}
.entry-row{display:grid;grid-template-columns:minmax(0,1fr) 88px auto;align-items:center;gap:10px}
.out{font:inherit;font-weight:700;font-size:.875rem;min-height:48px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
.out[aria-pressed="true"]{background:var(--out-soft);color:var(--out);border-color:var(--out)}

/* Log */
.log{display:grid;gap:8px;min-width:0}
.log-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:right;white-space:nowrap}
thead th{font-size:.875rem;font-weight:700;border-bottom:1px solid var(--line)}
thead th:first-child{color:var(--muted);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase}
th:first-child{text-align:left}
.th{display:inline-flex;align-items:center;gap:6px;max-width:9em}
.th .n{overflow:hidden;text-overflow:ellipsis}
.th .dot{width:9px;height:9px}
tbody tr.tap{cursor:pointer}
@media (hover:hover){tbody tr.tap:hover td,tbody tr.tap:hover th{background:var(--bg)}}
tbody tr.editing td,tbody tr.editing th{background:var(--out-soft)}
.rbtn{font:inherit;font-weight:700;min-width:34px;min-height:34px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.rnum{font-weight:700;color:var(--muted)}
.zero{display:inline-block;min-width:28px;text-align:center;background:var(--out-soft);color:var(--out);padding:1px 8px;border-radius:999px;font-weight:700}
tfoot th,tfoot td{border-top:1px solid var(--line);font-family:var(--display);font-weight:800;font-size:1.0625rem}

/* Footer + past games */
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.note{padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.fine{font-size:.8125rem;color:var(--muted)}
.past{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.past li{display:grid;gap:2px}

.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-16px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);font-weight:600;padding:10px 18px;border-radius:999px;z-index:20;text-align:center;
  max-width:calc(100% - 32px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));transition:opacity .2s ease,transform .2s ease}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
.mark-btn{font:inherit;color:inherit;letter-spacing:inherit;background:none;border:0;padding:0;cursor:pointer}

/* Lead-change stinger: player-color wipe, ink ribbon, slammed title, 3s total */
.stinger{position:fixed;inset:0;z-index:50;overflow:hidden;display:grid;place-items:center;cursor:pointer;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.st-wipe{position:absolute;top:-10%;bottom:-10%;left:-30%;width:160%;background:var(--pc);z-index:0;
  transform:translateX(-110%) skewX(-16deg);animation:st-wipe 3s cubic-bezier(.7,0,.2,1) forwards}
.st-ribbon{position:absolute;left:-20%;right:-20%;top:50%;height:clamp(220px,52vh,380px);background:var(--ink);z-index:1;
  transform:translate(110%,-50%) rotate(-6deg);animation:st-ribbon 3s cubic-bezier(.7,0,.2,1) forwards}
.st-text{position:relative;z-index:2;display:grid;justify-items:center;gap:4px;padding-inline:16px;text-align:center;color:var(--bg);
  transform:rotate(-6deg);animation:st-text 3s linear forwards}
.st-l1{display:grid;justify-items:center;font-family:var(--display);font-weight:800;font-size:clamp(3.2rem,17vw,7.5rem);line-height:.9;letter-spacing:-0.035em;
  animation:st-slam 3s cubic-bezier(.2,1.5,.4,1) forwards}
.st-swoosh{display:block;width:96%;height:auto;aspect-ratio:200/14;overflow:visible;margin-top:4px}
.st-swoosh path{fill:none;stroke:var(--pc);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:240;stroke-dashoffset:240;animation:st-draw 3s ease-out forwards}
.st-l2{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,8.5vw,3.6rem);line-height:1;letter-spacing:-0.02em;
  animation:st-rise 3s cubic-bezier(.2,1.2,.4,1) forwards}
.st-who{margin-top:12px;background:var(--pc);color:var(--on-pc);font-weight:800;font-size:clamp(1rem,4.4vw,1.375rem);padding:6px 16px;border-radius:999px;
  animation:st-pop 3s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes st-wipe{0%{transform:translateX(-110%) skewX(-16deg)}14%,84%{transform:translateX(0) skewX(-16deg)}100%{transform:translateX(110%) skewX(-16deg)}}
@keyframes st-ribbon{0%,8%{transform:translate(110%,-50%) rotate(-6deg)}22%,80%{transform:translate(0,-50%) rotate(-6deg)}94%,100%{transform:translate(-110%,-50%) rotate(-6deg)}}
@keyframes st-text{0%,20%{opacity:0}22%,80%{opacity:1}86%,100%{opacity:0}}
@keyframes st-slam{0%,22%{transform:scale(2.6);opacity:0}30%,100%{transform:scale(1);opacity:1}}
@keyframes st-draw{0%,30%{stroke-dashoffset:240}42%,100%{stroke-dashoffset:0}}
@keyframes st-rise{0%,32%{transform:translateY(36px) skewX(-8deg);opacity:0}40%,100%{transform:translateY(0) skewX(-8deg);opacity:1}}
@keyframes st-pop{0%,40%{transform:scale(.4);opacity:0}47%,100%{transform:scale(1);opacity:1}}
@keyframes st-fade{0%{opacity:0}12%,85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){
  .stinger{animation:st-fade 2.4s linear forwards}
  .st-wipe{animation:none;transform:skewX(-16deg)}
  .st-ribbon{animation:none;transform:translate(0,-50%) rotate(-6deg)}
  .st-text{animation:none;transform:rotate(-6deg)}
  .st-l1,.st-who{animation:none}
  .st-l2{animation:none;transform:skewX(-8deg)}
  .st-swoosh path{animation:none;stroke-dashoffset:0}
}

/* Phone-first touches */
html{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);align-items:center;
  margin-left:calc(-1 * max(16px, env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px, env(safe-area-inset-right,0px)));
  padding:8px max(16px, env(safe-area-inset-right,0px)) 8px max(16px, env(safe-area-inset-left,0px));transition:box-shadow .15s ease}
.top.scrolled{box-shadow:0 1px 0 var(--line),0 6px 16px var(--shadow)}
.top .meta{padding-bottom:0;white-space:nowrap}
button,.who,.row,.mark,.meta,.eyebrow,th,.toast,.stinger,.prog{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,input{touch-action:manipulation}
.btn:active,.out:active,.rbtn:active{transform:scale(.97)}
.save-bar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 10px 10px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px var(--shadow)}
.save-bar .btn{flex:none;min-height:52px;padding-inline:20px}
.prog{font-size:.875rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.prog.done{color:var(--lead)}
.entry-row .field{min-height:54px;font-size:1.375rem;scroll-margin-top:84px;scroll-margin-bottom:120px}
.out{min-width:64px;min-height:54px}
.log tbody th,.log thead th:first-child,.log tfoot th{position:sticky;left:0;z-index:1;background:var(--surface)}
.rbtn{min-width:38px;min-height:38px}
@media (max-width:520px){
  body{padding-block:12px 40px}
  .app{gap:14px}
  .mark{font-size:2rem}
  .meta{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;margin-bottom:8px}
  .panel{padding:14px;border-radius:16px;gap:12px}
  h2{font-size:1.3rem}
  .row{padding:10px 12px;gap:4px 10px}
  .total{font-size:1.6rem}
  th,td{padding:8px 10px}
  .foot .btn{flex:1}
}
@media (max-width:380px){.mark{font-size:2.1rem}.entry-row{grid-template-columns:minmax(0,1fr) 76px auto}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="stinger" class="stinger" role="status" aria-live="polite" hidden></div>

<script>
(function(){
  var root = document.getElementById('app');
  var toastEl = document.getElementById('toast');
  var LS_CUR = 'schwoop.current', LS_HIST = 'schwoop.history';

  var state = null, history = [], view = 'loading', mode = 'memory';
  var draftPlayers = [], draftDealer = 0, setupErr = '', choosingDealer = false;
  var entry = {}, editing = null, entryErr = '';
  var writeFlag = null, writeRejected = false;
  var gameRef = null, histCol = null, chain = Promise.resolve(), lastJSON = null;
  var armed = null, armTimer = null, loadTimer = null, loadNote = '', toastTimer = null;

  var SWOOSH = '<svg viewBox="0 0 200 14" preserveAspectRatio="none" aria-hidden="true"><path d="M2 11 C 55 1, 125 1, 198 8"/></svg>';

  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function newId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function col(p){ return 'var(--p' + (((p.c || 0) % 8) + 1) + ')'; }
  function plural(n, w){ return n + ' ' + w + (n === 1 ? '' : 's'); }
  function joinList(a){ return a.length <= 1 ? (a[0] || '') : a.slice(0,-1).join(', ') + ' and ' + a[a.length-1]; }
  function canWrite(){ return mode !== 'db' || (writeFlag !== false && !writeRejected); }
  function fmtDate(iso){ try { return new Date(iso).toLocaleDateString(undefined, {month:'short', day:'numeric'}); } catch(e){ return ''; } }

  function normalize(g){
    if (!g || !Array.isArray(g.players) || !g.players.length) return null;
    g.rounds = Array.isArray(g.rounds) ? g.rounds : [];
    g.players.forEach(function(p, i){ if (typeof p.c !== 'number') p.c = i; });
    if (typeof g.dealer !== 'number' || g.dealer < 0 || g.dealer >= g.players.length) g.dealer = 0;
    return g;
  }
  function totals(g){
    var t = {};
    g.players.forEach(function(p){ t[p.id] = 0; });
    g.rounds.forEach(function(r){ g.players.forEach(function(p){ t[p.id] += (r.s && r.s[p.id]) || 0; }); });
    return t;
  }
  function standings(g){
    var t = totals(g);
    var arr = g.players.map(function(p, i){ return {id:p.id, name:p.name, c:p.c, i:i, total:t[p.id]}; });
    arr.sort(function(a,b){ return a.total - b.total || a.i - b.i; });
    var rank = 0, prev = null;
    arr.forEach(function(p, k){ if (p.total !== prev){ rank = k + 1; prev = p.total; } p.rank = rank; });
    return arr;
  }
  /* Two trips around the table: every player deals twice. */
  function roundsTotal(g){ return g.players.length * 2; }
  function isOver(g){ return g.rounds.length >= roundsTotal(g); }
  function freshGame(names, dealer){
    return { id: 'g' + newId(), players: names.map(function(n, i){ return {id:'p' + newId() + i, name:n, c:i}; }), rounds: [], dealer: dealer || 0, startedAt: new Date().toISOString() };
  }

    }
    else if (a === 'pickDealer'){ draftDealer = parseInt(b.dataset.i, 10); render(); }
    else if (a === 'chooseDealer'){ choosingDealer = !choosingDealer; render(); }
    else if (a === 'setDealer'){
      var di = parseInt(b.dataset.i, 10), np = state.players.length;
      state.dealer = ((di - state.rounds.length) % np + np) % np;
      choosingDealer = false; persistGame(); render();
      toast(state.players[di].name + ' is dealing');
    }
    else if (a === 'start') startGame();
    else if (a === 'back'){ view = 'game'; render(); scrollTop(); }
    else if (a === 'out'){
      var pid = b.dataset.pid; entry[pid] = '0';
      var inp = document.getElementById('pts-' + pid); if (inp) inp.value = '0';
      b.setAttribute('aria-pressed', 'true');
      updateProg();
      var nx = nextEmpty(pid); if (nx) nx.focus();
    }
    else if (a === 'edit') startEdit(parseInt(b.dataset.i, 10));
    else if (a === 'cancelEdit'){ editing = null; entry = {}; entryErr = ''; disarm(); render(); }
    else if (a === 'deleteRound'){
      if (armed !== 'delete'){ arm('delete'); render(); return; }
      disarm(); var i = editing; state.rounds.splice(i, 1); editing = null; entry = {}; entryErr = '';
      persistGame(); render(); toast('Round ' + (i + 1) + ' deleted');
    }
    else if (a === 'newGame'){
      if (state.rounds.length && !isOver(state) && armed !== 'newGame'){ arm('newGame'); render(); return; }
      disarm(); toSetup();
    }
    else if (a === 'rematch'){
      archive(state);
      state = freshGame(state.players.map(function(p){ return p.name; }), (state.dealer + 1) % state.players.length);
      persistGame(); editing = null; entry = {}; entryErr = ''; choosingDealer = false;
      render(); scrollTop(); toast('Rematch on. ' + dealerOf(state, 0).name + ' deals first.');
    }
    else if (a === 'toSetup') toSetup();
    else if (a === 'stinger'){
      var top = leaders(state);
      if (top.length) playStinger(top[0], top.length > 1 ? joinList(top.map(function(p){ return p.name; })) + ' are tied' : top[0].name + (isOver(state) ? ' wins' : ' is leading'));
    }
  });
  root.addEventListener('input', function(e){
    var t = e.target;
    if (t.dataset && t.dataset.pid){
      var v = t.value.replace(/[^0-9]/g, '');
      if (v !== t.value) t.value = v;
      entry[t.dataset.pid] = v;
      var ob = root.querySelector('.out[data-pid="' + t.dataset.pid + '"]');
      if (ob) ob.setAttribute('aria-pressed', String(v === '0'));
      updateProg();
      if (entryErr){ entryErr = ''; var er = root.querySelector('#roundForm .err'); if (er) er.remove(); }
    } else if (t.id === 'newName' && setupErr){ setupErr = ''; var er2 = root.querySelector('.panel > .err'); if (er2) er2.remove(); }
  });
  root.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && e.target.dataset && e.target.dataset.pid){
      var nx = nextEmpty(e.target.dataset.pid);
      if (nx){ e.preventDefault(); nx.focus(); }
    }
  });
  root.addEventListener('submit', function(e){
    e.preventDefault();
    if (e.target.id === 'addForm') addPlayer();
    else if (e.target.id === 'roundForm') saveRound();
  });

  /* ---------- boot ---------- */
  function onGame(snap){
    clearTimeout(loadTimer); loadNote = '';
    var d = snap.exists ? snap.data() : null;
    var j = d ? JSON.stringify(d) : 'null';
    if (j === lastJSON && view !== 'loading') return;
    lastJSON = j;
    var prev = state, wasLoading = view === 'loading';
    state = d ? normalize(JSON.parse(j)) : null;
    if (view === 'loading') view = state ? 'game' : 'setup';
    else if (view === 'game' && !state) view = 'setup';
    if (editing !== null && (!state || editing >= state.rounds.length)){ editing = null; entry = {}; }
    render();
    if (!wasLoading && view === 'game') checkLeadChange(prev, state);
  }
  function initDb(db){
    mode = 'db';
    gameRef = db.doc('games/current');
    histCol = db.collection('history');
    loadTimer = setTimeout(function(){
      if (view === 'loading'){ loadNote = "Can't reach your saved game yet. It will show up here once the connection returns."; render(); }
    }, 10000);
    gameRef.onSnapshot(onGame, function(){
      clearTimeout(loadTimer);
      if (view === 'loading') view = 'setup';
      toast("Saved scores aren't available right now.");
      render();
    });
    histCol.orderBy('endedAt', 'desc').limit(20).onSnapshot(function(s){
      history = s.docs.map(function(d){ return d.data(); });
      if (view === 'setup') render();
    }, function(){});
  }
  function initLocal(){
    if (mode === 'db') return;
    mode = 'local';
    try {
      var c = localStorage.getItem(LS_CUR); state = c ? normalize(JSON.parse(c)) : null;
      var h = localStorage.getItem(LS_HIST); history = h ? JSON.parse(h) : [];
      if (!Array.isArray(history)) history = [];
    } catch(e){ mode = 'memory'; state = null; history = []; }
    view = state ? 'game' : 'setup';
    render();
  }

  render();
  if (window.claude && typeof window.claude.use === 'function'){
    window.claude.use('db').then(function(db){ if (db) initDb(db); else initLocal(); }).catch(initLocal);
    window.claude.use('user').then(function(u){
      if (!u || typeof u.can !== 'function') return;
      return Promise.resolve(u.can('data.write')).then(function(v){ if (v === false){ writeFlag = false; render(); } });
    }).catch(function(){});
  } else {
    initLocal();
  }
})();
</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
